
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJMOL VIP RUMMY - Memory Match</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#080808;color:white;font-family:Arial;text-align:center}
h1{color:#FFD36A}
h2{color:#D4AF37}
.info{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0}
.info div{background:#171717;border:1px solid #D4AF37;border-radius:10px;padding:12px;color:#FFD36A}
#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:360px;margin:25px auto}
.card{height:85px;background:#171717;border:2px solid #D4AF37;border-radius:12px;font-size:32px;color:#FFD36A}
.card.matched{background:#254126;border-color:#65c878}
button{background:#171717;color:#FFD36A;border:1px solid #D4AF37;border-radius:10px;padding:13px;font-size:16px;margin:6px}
#message{color:#FFD36A;font-size:19px;min-height:35px}
a{color:#FFD36A}
</style>
</head>
<body>

<h1>👑 AJMOL VIP RUMMY</h1>
<h2>🧠 MEMORY MATCH</h2>

<div class="info">
<div>Moves: <span id="moves">0</span></div>
<div>Pairs: <span id="pairs">0</span>/8</div>
</div>

<div id="board"></div>

<p id="message">Find all matching pairs!</p>

<button onclick="newGame()">🔄 New Game</button>
<br><br>
<a href="/home/">← Back to Home</a>

<script>
const emojis=["🍎","🍌","🍇","🍒","🍉","🍍","🥝","🍓"];
let cards=[];
let first=null;
let second=null;
let lock=false;
let moves=0;
let pairs=0;

function newGame(){
 cards=[...emojis,...emojis];
 cards.sort(()=>Math.random()-0.5);
 first=null;
 second=null;
 lock=false;
 moves=0;
 pairs=0;
 document.getElementById("moves").innerText=moves;
 document.getElementById("pairs").innerText=pairs;
 document.getElementById("message").innerText="Find all matching pairs!";
 draw();
}

function draw(){
 const board=document.getElementById("board");
 board.innerHTML="";
 cards.forEach((emoji,index)=>{
  const b=document.createElement("button");
  b.className="card";
  b.innerText="❓";
  b.onclick=()=>flip(index,b);
  board.appendChild(b);
 });
}

function flip(index,button){
 if(lock || button.classList.contains("matched") ||
 button===first)return;

 button.innerText=cards[index];
 button.style.color="white";

 if(!first){
  first=button;
  first.dataset.value=cards[index];
  first.dataset.index=index;
  return;
 }

 second=button;
 second.dataset.value=cards[index];
 second.dataset.index=index;
 moves++;
 document.getElementById("moves").innerText=moves;

 if(first.dataset.value===second.dataset.value){
  first.classList.add("matched");
  second.classList.add("matched");
  first.disabled=true;
  second.disabled=true;
  pairs++;
  document.getElementById("pairs").innerText=pairs;
  first=null;
  second=null;

  if(pairs===8){
   let coins=Number(localStorage.getItem("ajmol_coins"));
   if(!Number.isFinite(coins)||coins<=0)coins=1000;
   coins+=70;
   localStorage.setItem("ajmol_coins",String(coins));
   document.getElementById("message").innerText=
   document.getElementById("message").innerText="🎉 You won 70 Coins!";
  }
 }else{
  lock=true;
  setTimeout(()=>{
   first.innerText="❓";
   second.innerText="❓";
   first=null;
   second=null;
   lock=false;
  },800);
 }
}

newGame();
</script>
</body>
</html>
